<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spaced Text Generator</title>
  <style>
    :root {
      --bg: #1b1b1f;
      --bg-panel: #252529;
      --bg-toolbar: #1b1b20;
      --border-soft: #3a3a3f;
      --text-main: #f5f5f7;
      --text-muted: #a1a1aa;
      --accent: #0b74ff;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #070708;
      color: var(--text-main);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 10px 14px;
      gap: 10px;
    }

    /* TOOLBARS */
    .toolbar-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      background: var(--bg-toolbar);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
    }

    .toolbar-box label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 4px;
      user-select: none;
      -webkit-user-select: none;
    }

    .toolbar-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 2px;
      user-select: none;
      -webkit-user-select: none;
    }

    .toolbar-box input[type="text"],
    .toolbar-box input[type="number"] {
      background: #202025;
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      min-width: 50px;
      width: 170px;
      outline: none;
    }

    .toolbar-box input[type="number"] {
      width: 60px;
    }

    input[type="checkbox"] {
      margin-right: 4px;
    }

    .checkbox-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: #202025;
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-primary {
      background: var(--accent);
      border-color: #0a6ad6;
      color: #ffffff;
      font-weight: 500;
    }

    .btn-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn:hover {
      background: #2b2b30;
    }

    .btn-primary:hover {
      background: #0a6ad6;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* SLIDER */
    input[type="range"] {
      width: 170px;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: #3a3a3f;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 1px solid #ffffff;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 1px solid #ffffff;
      cursor: pointer;
    }

    /* PANELS */
    .panels {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-radius: 12px;
      min-width: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-soft);
    }

    .panel-header,
    .panel-footer {
      background: #1f1f24;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
    }

    .panel-header {
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-footer {
      border-top: 1px solid var(--border-soft);
    }

    .panel-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      user-select: none;
      -webkit-user-select: none;
    }

    .panel-stats {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 10px 12px;
      background: #15151a;
      color: var(--text-main);
      font-size: 22px;
      line-height: 1.5;
      font-family: Consolas, Menlo, monospace;
      overflow: auto;
    }

    /* FULLSCREEN */
    .panel-fullscreen {
      position: fixed;
      inset: 10px;
      z-index: 999;
      width: calc(100vw - 20px);
      height: calc(100vh - 20px);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .panels {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="toolbar-section">
      <!-- MAIN TOOLBAR -->
      <div class="toolbar-box">
        <span class="toolbar-label">Space style:</span>
        <input id="spaceCount" type="number" min="0" max="10" value="0">
        <span class="toolbar-label">spaces</span>

        <label class="checkbox-label">
          <input id="spaceAll" type="checkbox" checked>
          Spaced all
        </label>

        <label class="checkbox-label">
          <input id="spaceSelected" type="checkbox">
          Spaced selected
        </label>

        <label class="checkbox-label">
          <input id="wordOnly" type="checkbox">
          Word-only spacing
        </label>

        <button id="undoBtn" class="btn">Undo</button>
        <button id="redoBtn" class="btn">Redo</button>

        <span class="toolbar-label">Font size:</span>
        <input id="fontSlider" type="range" min="12" max="48" value="22">
        <span class="toolbar-label" id="fontValue">22px</span>

        <button id="startBtn" class="btn btn-primary">
          ▶ Start Spaced
        </button>
      </div>

      <!-- FIND REPLACE -->
      <div class="toolbar-box">
        <span class="toolbar-label">Find:</span>
        <input id="findInput" type="text" placeholder="Text to find">
        <button id="findPrevBtn" class="btn">Find ↑</button>
        <button id="findNextBtn" class="btn">Find ↓</button>
        <span class="toolbar-label">Replace:</span>
        <input id="replaceInput" type="text" placeholder="Replacement">
        <button id="replaceBtn" class="btn">
          Replace
        </button>
        <button id="replaceAllBtn" class="btn">
          Replace All
        </button>
      </div>

      <!-- LINE OPERATIONS -->
      <div class="toolbar-box">
        <button id="splitLinesBtn" class="btn">
          Split Lines
        </button>
        <button id="joinLinesBtn" class="btn">
          Join Lines
        </button>
        <button id="sortAscBtn" class="btn">
          Sort Lines Ascending
        </button>
        <button id="sortDescBtn" class="btn">
          Sort Lines Descending
        </button>
      </div>
    </div>

    <!-- PANELS -->
    <div class="panels">
      <!-- INPUT -->
      <div id="inputPanel" class="panel">
        <div class="panel-header">
          <div class="panel-title">
            Panel · Text
          </div>
          <div class="panel-stats" id="charCount">
            Characters: 0
          </div>
          <div>
            <button class="btn fullscreen-btn" data-target="inputPanel">
              Full
            </button>
          </div>
        </div>
        <div class="panel-body">
          <textarea id="txt"></textarea>
        </div>
        <div class="panel-footer">
          <div>
            <input id="importFile" type="file" hidden>
            <button id="importBtn" class="btn">
              Import Text
            </button>
          </div>
          <button id="clearInputBtn" class="btn btn-danger">
            Clear
          </button>
        </div>
      </div>

      <!-- RESULTS -->
      <div id="resultsPanel" class="panel">
        <div class="panel-header">
          <div class="panel-title">
            Panel · Results
          </div>
          <div>
            <button class="btn fullscreen-btn" data-target="resultsPanel">
              Full
            </button>
          </div>
        </div>
        <div class="panel-body">
          <textarea id="results" readonly></textarea>
        </div>
        <div class="panel-footer">
          <button id="exportBtn" class="btn">
            Export Text
          </button>
          <button id="copyBtn" class="btn">
            Copy
          </button>
          <button id="clearResultsBtn" class="btn btn-danger">
            Clear
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ELEMENTS */
    const txt = document.getElementById("txt");
    const results = document.getElementById("results");
    const charCount = document.getElementById("charCount");
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const spaceCount = document.getElementById("spaceCount");
    const spaceAll = document.getElementById("spaceAll");
    const spaceSelected = document.getElementById("spaceSelected");
    const wordOnly = document.getElementById("wordOnly");
    const startBtn = document.getElementById("startBtn");
    const findInput = document.getElementById("findInput");
    const replaceInput = document.getElementById("replaceInput");
    const findNextBtn = document.getElementById("findNextBtn");
    const findPrevBtn = document.getElementById("findPrevBtn");
    const replaceBtn = document.getElementById("replaceBtn");
    const replaceAllBtn = document.getElementById("replaceAllBtn");
    const fontSlider = document.getElementById("fontSlider");
    const fontValue = document.getElementById("fontValue");
    const clearInputBtn = document.getElementById("clearInputBtn");
    const clearResultsBtn = document.getElementById("clearResultsBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const exportBtn = document.getElementById("exportBtn");
    const copyBtn = document.getElementById("copyBtn");
    const splitLinesBtn = document.getElementById("splitLinesBtn");
    const joinLinesBtn = document.getElementById("joinLinesBtn");
    const sortAscBtn = document.getElementById("sortAscBtn");
    const sortDescBtn = document.getElementById("sortDescBtn");
    /* HISTORY */
    const history = [];
    let historyIndex = -1;
    let isApplyingHistory = false;

    function pushHistory() {
      if (isApplyingHistory) return;
      const snapshot = {
        value: txt.value,
        selectionStart: txt.selectionStart,
        selectionEnd: txt.selectionEnd
      };
      if (historyIndex >= 0) {
        const current = history[historyIndex];
        if (
          current.value === snapshot.value &&
          current.selectionStart === snapshot.selectionStart &&
          current.selectionEnd === snapshot.selectionEnd
        ) {
          return;
        }
      }
      history.splice(historyIndex + 1);
      history.push(snapshot);
      historyIndex = history.length - 1;
      updateUndoRedoButtons();
    }

    function applyHistory(index) {
      if (index < 0 || index >= history.length) return;
      const s = history[index];
      isApplyingHistory = true;
      txt.value = s.value;
      txt.selectionStart = s.selectionStart;
      txt.selectionEnd = s.selectionEnd;
      isApplyingHistory = false;
      txt.focus();
      historyIndex = index;
      updateUndoRedoButtons();
      updateCharCount();
      generateResult();
    }

    function updateUndoRedoButtons() {
      undoBtn.disabled = historyIndex <= 0;
      redoBtn.disabled = historyIndex >= history.length - 1;
    }
    undoBtn.onclick = () => {
      if (historyIndex > 0) {
        applyHistory(historyIndex - 1);
      }
    };
    redoBtn.onclick = () => {
      if (historyIndex < history.length - 1) {
        applyHistory(historyIndex + 1);
      }
    };
    txt.addEventListener("input", () => {
      pushHistory();
      updateCharCount();
      generateResult();
      txt.scrollTop = txt.scrollHeight;
    });
    /* CHARACTER COUNT */
    function updateCharCount() {
      charCount.textContent =
        "Characters: " + txt.value.length;
    }
    /* SPACING LOGIC */
    function applySpacing(text, count) {
      if (!text) return "";
      const spaces = " ".repeat(count);
      if (wordOnly.checked) {
        return text
          .split("\n")
          .map(line =>
            line.split(" ").join(spaces)
          )
          .join("\n");
      }
      return text
        .split("\n")
        .map(line =>
          line.split("").join(spaces)
        )
        .join("\n");
    }

    function generateResult() {
      const count =
        parseInt(spaceCount.value, 10) || 0;
      const fullText = txt.value;
      if (!fullText) {
        results.value = "";
        return;
      }
      if (spaceAll.checked) {
        results.value =
          applySpacing(fullText, count);
        return;
      }
      const start = txt.selectionStart;
      const end = txt.selectionEnd;
      if (start === end) {
        results.value =
          applySpacing(fullText, count);
        return;
      }
      const before = fullText.slice(0, start);
      const selected = fullText.slice(start, end);
      const after = fullText.slice(end);
      results.value =
        before +
        applySpacing(selected, count) +
        after;
    }
    startBtn.onclick = generateResult;
    /* FONT SIZE */
    fontSlider.oninput = e => {
      const size = e.target.value + "px";
      txt.style.fontSize = size;
      results.style.fontSize = size;
      fontValue.textContent = size;
    };
    /* CLEAR */
    clearInputBtn.onclick = () => {
      txt.value = "";
      updateCharCount();
      results.value = "";
      pushHistory();
    };
    clearResultsBtn.onclick = () => {
      results.value = "";
    };
    /* IMPORT */
    importBtn.onclick = () => {
      importFile.click();
    };
    importFile.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        txt.value = ev.target.result;
        updateCharCount();
        generateResult();
        pushHistory();
      };
      reader.readAsText(file);
      importFile.value = "";
    };
    /* EXPORT */
    exportBtn.onclick = () => {
      const blob = new Blob(
        [results.value], {
          type: "text/plain;charset=utf-8"
        }
      );
      const url =
        URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "spaced-text.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
    /* COPY */
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(
        results.value
      );
    };
    /* FULLSCREEN */
    document
      .querySelectorAll(".fullscreen-btn")
      .forEach(btn => {
        btn.onclick = () => {
          const panel =
            document.getElementById(
              btn.dataset.target
            );
          const full =
            panel.classList.toggle(
              "panel-fullscreen"
            );
          btn.textContent =
            full ? "Exit" : "Full";
        };
      });
    /* LINE OPERATIONS */
    splitLinesBtn.onclick = () => {
      txt.value =
        txt.value.replace(/ +/g, "\n");
      updateCharCount();
      generateResult();
      pushHistory();
    };
    joinLinesBtn.onclick = () => {
      txt.value =
        txt.value.split("\n").join(" ");
      updateCharCount();
      generateResult();
      pushHistory();
    };
    sortAscBtn.onclick = () => {
      const lines =
        txt.value.split("\n");
      lines.sort((a, b) =>
        a.localeCompare(b)
      );
      txt.value = lines.join("\n");
      updateCharCount();
      generateResult();
      pushHistory();
    };
    sortDescBtn.onclick = () => {
      const lines =
        txt.value.split("\n");
      lines.sort((a, b) =>
        b.localeCompare(a)
      );
      txt.value = lines.join("\n");
      updateCharCount();
      generateResult();
      pushHistory();
    };
    /* FIND REPLACE */
    let lastIndex = -1;

    function scrollSelectionIntoView(textarea) {
      const start =
        textarea.selectionStart;
      const before =
        textarea.value.substring(
          0, start
        );
      const mirror =
        document.createElement("div");
      const style =
        getComputedStyle(textarea);
      mirror.style.position = "absolute";
      mirror.style.visibility = "hidden";
      mirror.style.whiteSpace = "pre-wrap";
      mirror.style.wordWrap = "break-word";
      mirror.style.width =
        textarea.clientWidth + "px";
      mirror.style.font = style.font;
      mirror.style.lineHeight =
        style.lineHeight;
      mirror.style.padding =
        style.padding;
      mirror.textContent = before;
      const span =
        document.createElement("span");
      span.textContent = "|";
      mirror.appendChild(span);
      document.body.appendChild(mirror);
      const y = span.offsetTop;
      document.body.removeChild(mirror);
      textarea.scrollTop =
        Math.max(
          0,
          y - textarea.clientHeight / 2
        );
    }

    function selectFound(pos, len) {
      txt.focus();
      txt.setSelectionRange(
        pos,
        pos + len
      );
      scrollSelectionIntoView(txt);
    }

    function findNext() {
      const query =
        findInput.value;
      if (!query) return;
      const text = txt.value;
      lastIndex =
        text.indexOf(
          query,
          lastIndex + 1
        );
      if (lastIndex === -1) {
        lastIndex =
          text.indexOf(query);
      }
      if (lastIndex === -1) return;
      selectFound(lastIndex, query.length);
    }

    function findPrev() {
      const query =
        findInput.value;
      if (!query) return;
      const text = txt.value;
      if (lastIndex === -1) {
        lastIndex =
          text.lastIndexOf(query);
      } else {
        const before =
          text.substring(
            0,
            lastIndex
          );
        lastIndex =
          before.lastIndexOf(query);
        if (lastIndex === -1) {
          lastIndex =
            text.lastIndexOf(query);
        }
      }
      if (lastIndex === -1) return;
      selectFound(lastIndex, query.length);
    }

    function replaceOne() {
      const find =
        findInput.value;
      const rep =
        replaceInput.value;
      if (!find) return;
      const start =
        txt.selectionStart;
      const end =
        txt.selectionEnd;
      if (
        txt.value.substring(
          start, end
        ) === find
      ) {
        txt.setRangeText(
          rep,
          start,
          end,
          "end"
        );
        pushHistory();
        updateCharCount();
        generateResult();
        findNext();
      } else {
        findNext();
      }
    }

    function replaceAll() {
      const find =
        findInput.value;
      const rep =
        replaceInput.value;
      if (!find) return;
      const re =
        new RegExp(
          find.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          ),
          "g"
        );
      txt.value =
        txt.value.replace(re, rep);
      pushHistory();
      updateCharCount();
      generateResult();
    }
    findNextBtn.onclick = findNext;
    findPrevBtn.onclick = findPrev;
    replaceBtn.onclick = replaceOne;
    replaceAllBtn.onclick = replaceAll;
    /* CHECKBOX BEHAVIOR */
    spaceAll.onchange = () => {
      if (spaceAll.checked) {
        spaceSelected.checked = false;
      }
    };
    spaceSelected.onchange = () => {
      if (spaceSelected.checked) {
        spaceAll.checked = false;
      }
    };
    /* INIT */
    updateCharCount();
    pushHistory();
  </script>
</body>

</html>
